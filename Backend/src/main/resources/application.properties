spring.application.name=backend
# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pluggedorchid
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Show SQL and parameter binding
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.pluggedorchid=DEBUG

# JWT
jwt.secret=${JWT_SECRET:}
jwt.access-expiration=900000   
# 15 minutes in ms
jwt.refresh-expiration=604800000 
# 7 days in ms

# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=E-commerce Platform API
springdoc.info.description=REST API for e-commerce and analytics
springdoc.info.version=v1.0

# Cloudinary (replace with your own credentials)
#cloudinary.cloud-name=your-cloud-name
#cloudinary.api-key=your-api-key
#cloudinary.api-secret=your-api-secret
#cloudinary.upload-folder=plugged-products

# Cloudinary configuration
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
cloudinary.upload-folder=PluggedbyO

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Scheduling
spring.task.scheduling.pool.size=5
